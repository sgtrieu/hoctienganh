function normalize(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/[.,!?']/g,"")
        .replace(/\s+/g," ");
}

function speakSentence(index){

    speechSynthesis.cancel();

    let speech =
    new SpeechSynthesisUtterance(
        sentences[index].en
    );

    speech.lang = "en-US";
    speech.rate = 0.8;

    speechSynthesis.speak(speech);
}

function check(index){

    let user =
    normalize(
        document.getElementById(
            "answer" + index
        ).value
    );

    let correct =
    normalize(
        sentences[index].en
    );

    let result =
    document.getElementById(
        "result" + index
    );

    if(user === correct){

        result.innerHTML =
        "✅ Đúng";

    }else{

        result.innerHTML =
        "❌ Sai<br><br>" +
        "<b>Đáp án:</b> " +
        sentences[index].en +
        "<br><b>Nghĩa:</b> " +
        sentences[index].vi;
    }
}
